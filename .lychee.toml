# Shared lychee settings for the docs link checks (see CONTRIBUTING.md).
# Ignored URLs live in .lycheeignore at the repository root.

no_progress = true
timeout = 20
max_retries = 3
retry_wait_time = 5
max_concurrency = 8
accept = ["200..=299", "429"]
include_fragments = "full"
user_agent = "Mozilla/5.0 (compatible; vexillum-docs-ci; +https://github.com/isaias-alt/vexillum)"
