version: 2

project_name: vexillum

before:
  hooks:
    - go mod tidy

builds:
  - id: vx
    main: ./cmd/vx
    binary: vx
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - id: vx
    formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    # Setting files replaces goreleaser's default glob, so LICENSE and README
    # are listed too. The notices travel with the binary that embeds that code.
    files:
      - LICENSE
      - README.md
      - THIRD-PARTY-NOTICES.md

checksum:
  name_template: checksums.txt

# The changelog is generated from conventional commits at release time and is
# never edited by hand. goreleaser publishes it as the GitHub release notes;
# the docs page /docs/changelog is built from those release notes by
# site/scripts/changelog.mjs. There is deliberately no CHANGELOG.md in the repo.
changelog:
  sort: asc
  abbrev: 7
  format: "{{ .SHA }} {{ .Message }}"
  filters:
    exclude:
      - "^chore(\\(.*\\))?!?:"
      - "^test(\\(.*\\))?!?:"
      - "^binnacle(\\(.*\\))?!?:"
      - "^Merge "
  groups:
    - title: Features
      regexp: '^.*?feat(\(.+\))??!?:.+$'
      order: 0
    - title: Bug fixes
      regexp: '^.*?fix(\(.+\))??!?:.+$'
      order: 1
    - title: Documentation
      regexp: '^.*?docs(\(.+\))??!?:.+$'
      order: 2
    - title: Others
      order: 999

brews:
  - name: vexillum
    repository:
      owner: isaias-alt
      name: homebrew-tap
      branch: main
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    directory: Formula
    commit_author:
      name: vexillum release bot
      email: cascolucasisaias@gmail.com
    homepage: https://github.com/isaias-alt/vexillum
    description: "CLI orchestrator for code agents"
    license: "MIT"
    # Only stable tags reach the tap: rc and canary tags (semver pre-releases)
    # must never overwrite the formula that brew users get.
    skip_upload: auto
    install: |
      bin.install "vx"
    extra_install: |
      doc.install "LICENSE", "THIRD-PARTY-NOTICES.md"
    caveats: |
      vx needs Claude Code (logged in) and herdr installed.
      Run `vx init` inside a git repository to set it up.
      Then run `vx doctor` to check your environment.
      Docs: https://vx.lucasco.dev
    test: |
      system "#{bin}/vx", "--version"

release:
  github:
    owner: isaias-alt
    name: vexillum
  # Tags with a pre-release suffix (-rc.N, -canary.<date>.<sha>) are published
  # as GitHub pre-releases, so releases/latest keeps pointing at the last stable.
  prerelease: auto
  header: |
    Install: `brew install isaias-alt/tap/vexillum`, or the curl command in the [README](https://github.com/isaias-alt/vexillum#install). Requires Claude Code (logged in), herdr and git.
    Soldiers run unsandboxed with full access to your machine, see the [warning in the README](https://github.com/isaias-alt/vexillum#install).

  footer: |
    {{ if .PreviousTag }}**Full changelog**: https://github.com/isaias-alt/vexillum/compare/{{ .PreviousTag }}...{{ .Tag }}{{ end }}
