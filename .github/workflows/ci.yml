name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: gofmt
        run: |
          fmt_out="$(gofmt -l .)"
          if [ -n "$fmt_out" ]; then
            echo "gofmt needs to be run on:"
            echo "$fmt_out"
            exit 1
          fi

      - name: Test (with coverage profiling)
        run: go test ./... -race -covermode=atomic -coverprofile=coverage.out -coverpkg=./...

      - name: Coverage report and minimum-threshold gate
        run: |
          go tool cover -func=coverage.out | tee coverage.txt

          total="$(grep '^total:' coverage.txt | awk '{print $3}' | tr -d '%')"
          threshold=55

          {
            echo "### Test coverage"
            echo
            echo "Total: **${total}%** (minimum required: ${threshold}%)"
          } >> "$GITHUB_STEP_SUMMARY"

          echo "Total coverage: ${total}% (minimum required: ${threshold}%)"

          if awk -v t="$total" -v th="$threshold" 'BEGIN { exit !(t < th) }'; then
            echo "Coverage ${total}% is below the minimum threshold of ${threshold}%."
            exit 1
          fi
