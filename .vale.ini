# Vale prose lint for the English docs. Advisory only: CI reports it and
# never fails on it. Spanish pages are not linted.
# Run: vale site/content/docs/en README.md CONTRIBUTING.md
StylesPath = .vale/styles
MinAlertLevel = suggestion

[*.{md,mdx}]
BasedOnStyles = Vale, Vexillum
# Spelling and terminology need a curated vocabulary; the rest of Vale's
# built-ins are generic prose rules that fight technical writing.
Vale.Spelling = NO
Vale.Terms = NO
Vale.Avoid = NO

# Generated from the command registry and the embedded skills: the text is
# the binary's own, so style findings there are not actionable.
[site/content/docs/en/reference/{cli,skills}/*.mdx]
BasedOnStyles =
[site/content/docs/en/reference/slot-block.mdx]
BasedOnStyles =
