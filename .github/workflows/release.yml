name: Release

# Releases a tag that was pushed by hand. The canary and stable-release
# workflows tag and release in their own job: a tag pushed with GITHUB_TOKEN
# does not start this workflow. Tags with a pre-release suffix (-rc.N,
# -canary.<date>.<sha>) become GitHub pre-releases and never reach the tap.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: ./.github/actions/goreleaser
        with:
          tag: ${{ github.ref_name }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          homebrew-tap-token: ${{ !contains(github.ref_name, '-') && secrets.HOMEBREW_TAP_TOKEN || '' }}
