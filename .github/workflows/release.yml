name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}

      # goreleaser has already published these notes as the GitHub release
      # body, which is what the docs page /docs/changelog is built from (see
      # site/scripts/changelog.mjs). Keep the file too, for inspection.
      - uses: actions/upload-artifact@v4
        with:
          name: changelog
          path: dist/CHANGELOG.md
