name: Prune canary

# Deletes old canary pre-releases and their tags. A build is kept when it is
# among the newest keep_count builds or younger than keep_days days. Only
# pre-releases tagged vX.Y.Z-canary.<date>.<sha> are ever considered: stable
# and rc releases and tags are never touched.
#
# It is a dry run unless you untick dry_run: it only lists what it would delete.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Only list what would be deleted
        type: boolean
        default: true
      keep_days:
        description: Keep canary builds younger than this many days
        type: string
        default: "30"
      keep_count:
        description: Keep this many of the newest canary builds
        type: string
        default: "30"

permissions:
  contents: write

jobs:
  prune:
    if: github.repository == 'isaias-alt/vexillum'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prune canary pre-releases
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          DRY_RUN: ${{ inputs.dry_run }}
          KEEP_DAYS: ${{ inputs.keep_days }}
          KEEP_COUNT: ${{ inputs.keep_count }}
        run: scripts/prune-canary.sh | tee -a "$GITHUB_STEP_SUMMARY"
