version: 2

project_name: vexillum

before:
  hooks:
    - go mod tidy

builds:
  - id: vx
    main: ./cmd/vx
    binary: vx
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - id: vx
    formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}

checksum:
  name_template: checksums.txt

# The changelog is generated from conventional commits at release time and is
# never edited by hand. goreleaser publishes it as the GitHub release notes;
# the docs page /docs/changelog is built from those release notes by
# site/scripts/changelog.mjs. There is deliberately no CHANGELOG.md in the repo.
changelog:
  sort: asc
  abbrev: 7
  format: "{{ .SHA }} {{ .Message }}"
  filters:
    exclude:
      - "^chore(\\(.*\\))?!?:"
      - "^test(\\(.*\\))?!?:"
      - "^binnacle(\\(.*\\))?!?:"
      - "^Merge "
  groups:
    - title: Features
      regexp: '^.*?feat(\(.+\))??!?:.+$'
      order: 0
    - title: Bug fixes
      regexp: '^.*?fix(\(.+\))??!?:.+$'
      order: 1
    - title: Documentation
      regexp: '^.*?docs(\(.+\))??!?:.+$'
      order: 2
    - title: Others
      order: 999

brews:
  - name: vexillum
    repository:
      owner: isaias-alt
      name: homebrew-tap
      branch: main
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    directory: Formula
    commit_author:
      name: vexillum release bot
      email: cascolucasisaias@gmail.com
    homepage: https://github.com/isaias-alt/vexillum
    description: "CLI orchestrator for code agents"
    license: "MIT"
    install: |
      bin.install "vx"
    test: |
      system "#{bin}/vx", "--version"

release:
  github:
    owner: isaias-alt
    name: vexillum
  footer: |
    {{ if .PreviousTag }}**Full changelog**: https://github.com/isaias-alt/vexillum/compare/{{ .PreviousTag }}...{{ .Tag }}{{ end }}
